<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h1>Student Result Management System</h1>

        <form id="resultForm">

            <label>Student Name</label>
            <input type="text" id="name" required>

            <label>Roll Number</label>
            <input type="text" id="roll" required>

            <label>Subject 1 Marks</label>
            <input type="number" id="sub1" min="0" max="100" required>

            <label>Subject 2 Marks</label>
            <input type="number" id="sub2" min="0" max="100" required>

            <label>Subject 3 Marks</label>
            <input type="number" id="sub3" min="0" max="100" required>

            <label>Subject 4 Marks</label>
            <input type="number" id="sub4" min="0" max="100" required>

            <label>Subject 5 Marks</label>
            <input type="number" id="sub5" min="0" max="100" required>

            <button type="submit">Calculate Result</button>
            <button type="reset" class="clear">Clear</button>

        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
